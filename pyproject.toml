[project]
name = "arch-review-agent"
version = "1.0.0"
description = "Compact, production-grade PSO Cloud Landing Zone & Zero-Trust Red-Team vs. Blue-Team Architecture Review Multi-Agent System built with Google ADK."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "google-adk>=1.15.0",
    "google-genai>=1.20.0",
    "pydantic>=2.7.0",
    "python-json-logger>=2.0.7",
    "opentelemetry-api>=1.25.0",
    "opentelemetry-sdk>=1.25.0",
    "opentelemetry-exporter-gcp-trace>=1.7.0",
    "google-cloud-logging>=3.11.0",
    "google-cloud-dlp>=3.18.0",
    "google-cloud-secret-manager>=2.20.0",
    "google-cloud-firestore>=2.16.0",
    "google-cloud-discoveryengine>=0.13.0",
    "sqlalchemy>=2.0.0",
    "uvicorn>=0.34.0",
    "fastapi>=0.115.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.0",
]
eval = [
    "google-adk[eval]>=1.20.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]
